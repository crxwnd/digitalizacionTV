version: "3.8"

# Solo base de datos para desarrollo local
# Backend y Frontend corren nativamente en tu máquina

services:
  postgres:
    image: postgres:14-alpine
    container_name: dtv_postgres_dev
    environment:
      POSTGRES_DB: digitalizacion_tv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Hotel2024!"
    volumes:
      - dtv_pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: dtv_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  dtv_pgdata_dev:
